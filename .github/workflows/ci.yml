name: CI

on:
  push:
    branches:
      - main
      - feat/core-engine-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      # Run browser interactions against the PR code, not a deployed main build.
      - name: Chromium browser validation
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node tests/browser/smoke.mjs
